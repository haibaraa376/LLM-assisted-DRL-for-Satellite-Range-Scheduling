baselines:
  seed: 2025
  device: auto

  methods:
    manual_mappo:
      enabled: true
      implementation: existing

    # PPO-Lya的势函数形式和参数是复现补充设置，不是论文公开参数。
    ppo_lya:
      enabled: true
      base_reward: manual_reward
      lyapunov:
        gamma: 0.99
        shaping_coefficient: 0.20
        feature_weights:
          backlog: 0.45
          expiration_risk: 0.35
          expired_undelivered: 0.10
          utilization_imbalance: 0.10
        urgency_power: 2.0
        numerical_tolerance: 1.0e-9
        hard_failure_abs_shaping: 5.0

    # LLM-PPO使用DeepSeek替代论文中的LLM，不使用RAG。
    # DeepSeek只生成八项奖励权重JSON，不接触环境，也不生成可执行代码。
    llm_ppo:
      enabled: true
      provider:
        default: mock
        live_provider: deepseek
        api_key_env: DEEPSEEK_API_KEY
        base_url: https://api.deepseek.com
        model: deepseek-v4-pro
        thinking_enabled: true
        reasoning_effort: high
        max_tokens: 2500
        timeout_seconds: 120
        max_retries: 2
        retry_delays_seconds: [2, 5]
      output:
        mode: reward_weights_json
        allow_arbitrary_python: false
        require_json_output: true
        reject_unknown_fields: true
      weight_limits:
        minimum: 0.0
        maximum: 3.0
      selected_reward_spec_path: results/baselines/reward_specs/selected_reward_spec.json

      search:
        rounds: 5
        candidates_per_round: 8
        candidate_training_episodes: 5
        evaluation_protocol: reward_search
        maximum_api_calls: 60
        maximum_total_input_tokens: 1000000
        maximum_total_output_tokens: 200000
      cache:
        enabled: true
        directory: results/baselines/llm_search/api_calls
      reward_mode: direct_llm_l1
      reward_schema_version: "2.0"
      conflict_fixed_zero: true

  # 三种方法共享训练预算、任务划分和验证场景；test本阶段禁止使用。
  training:
    split: train
    task_count: 150
    # 正式训练重复同一个场景；validation/test的seed由下方协议独立管理。
    training_seed: 2025
    episode_count: 5
    rollout_steps: 64
    validation_interval_episodes: 1
    validation:
      protocol: checkpoint_selection

  # 以下池和seed均为本项目复现补充设置，并非论文公开参数。
  evaluation_protocols:
    split_seed: 2027
    reward_search:
      task_count: 150
      seeds: [3025]
    checkpoint_selection:
      # 任务数运行时自动等于training.task_count，禁止在此重复配置。
      seeds: [4025]
    test:
      task_count: 150
      seeds: [5025]

  best_model_rule:
    # HERON-inspired：先比较任务是否完成，再比较过期与最终真实下传质量。
    # 这不是完整 HERON 偏好奖励模型复现，只是透明的候选筛选规则。
    mode: heron_hierarchical
    hierarchy:
      - {metric: completion_rate, direction: max, absolute_margin: 0.0, relative_margin: 0.0, std_scale: 1.0}
      - {metric: expiration_rate, direction: min, absolute_margin: 0.0, relative_margin: 0.0, std_scale: 1.0}
      - {metric: delivered_timeliness_raw, direction: max, absolute_margin: 1.0e-6, relative_margin: 0.0, std_scale: 1.0}
      - {metric: delivered_data_mbit, direction: max, absolute_margin: 1.0e-3, relative_margin: 0.0, std_scale: 1.0}
      - {metric: rejected_subaction_rate, direction: min, absolute_margin: 0.0, relative_margin: 0.0, std_scale: 1.0}
      - {metric: load_balance_mean_per_task, direction: max, absolute_margin: 1.0e-9, relative_margin: 0.0, std_scale: 1.0}
      - {metric: sgl_action_fraction, direction: max, absolute_margin: 0.0, relative_margin: 0.0, std_scale: 1.0}
    # 保留旧规则，设置 mode: tolerance_lexicographic 时用于历史消融。
    metrics:
      - {metric: delivered_timeliness_raw_mean, direction: max, tolerance: 1.0e-6}
      - {metric: completion_rate_mean, direction: max, tolerance: 1.0e-6}
      - {metric: expiration_rate_mean, direction: min, tolerance: 1.0e-6}
      - {metric: delivered_data_mbit_mean, direction: max, tolerance: 1.0e-3}
      - {metric: load_balance_mean_per_task_mean, direction: max, tolerance: 1.0e-9}
      - {metric: rejected_subaction_rate_mean, direction: min, tolerance: 1.0e-9}

  artifact_management:
    # 逐Episode指标与日志保留；模型仅保留best/last两个边界Checkpoint。
    save_episode_checkpoints: false
    write_learning_curves: true
    compact_completed_runs: false

  # 所有候选都完成相同的五个Episode，仅以最后两个Episode的validation排名。
  candidate_selection:
    tail_episodes: 2

  output:
    root: results/baselines
    runs_directory: results/baselines/runs
    reward_specs_directory: results/baselines/reward_specs
    llm_search_directory: results/baselines/llm_search
